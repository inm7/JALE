# Project Folder
project:
  analysis_info: "analysis_info.xlsx"
  experiment_info: "experiment_info.xlsx"


# ALE Parameters

parameters:
  
  # If enabled pools multiple experiments from same paper into one experiment;
  pool_experiments: False # Recommended only for "ALL" analyses

  # If enabled TFCE is in addition to standard thresholding methods calculated (Frahm et al., 2022)
  tfce_enabled: True

  # If enabled ALE map (and therefore all following maps) will be masked by ICBM 10% GM mask; 
  gm_masking: True # Recommended: True

  # Size of bins used in MA histogram
  bin_steps: 0.0001 # Use and don't change: 0.0001
  
  # If enabled uses xgboost models to predict cutoffs instead of monte carlo simulation (Frahm et al., 2024);
  # If dataset>150, Foci of one/more experiment >150 and sample size of one/more experiment >300:
  # Please verify the results by calculating the analyses with the traditional permutation
  cutoff_predict_enabled: True # Recommended: True;
  

  # P-value required for significance
  # !! ONLY IF CUTOFF PREDICT IS DISABLED, OTHERWISE WON'T HAVE EFFECT !!
  significance_threshold: 0.05 # Recommended: 0.05

  # Preliminary cluster forming threshold used in cluster-level family wise error correction
  # !! ONLY IF CUTOFF PREDICT IS DISABLED, OTHERWISE WON'T HAVE EFFECT !!
  cluster_forming_threshold: 0.001 # Recommended: 0.001

  # Iterations used for monte-carlo based multiple comparison correction 
  # !! ONLY IF CUTOFF PREDICT IS DISABLED, OTHERWISE WON'T HAVE EFFECT !!
  monte_carlo_iterations: 5000 # Recommended: 5000

  # N subsamples calculated for probabilistic ALE algorithm
  subsample_n: 2500 # Recommended: 2500 (for smaller datasets only the max. of unique subsamples is used)

  # Iterations used in classic contrast algorithm
  contrast_permutations: 10000 # Recommended: 10000

  # Correction Method on which to base contrast algorithm
  contrast_correction_method: "cFWE" 

  # Sub-Iterations used in balanced contrast algorithm
  difference_iterations: 1000 # Recommended: 1000

  # Number of parallel processes used for different steps in the ALE algorithm - depends on your machine
  nprocesses: 2


# MA_Clustering Parameters
clustering_parameters:
  max_clusters: 10 
  subsample_fraction: 0.9 # Recommended: 0.9
  sampling_iterations: 1000 # Recommended: 1000
  null_iterations: 5000 # Recommended: 5000
  correlation_type: "spearman" # Options: "spearman", "pearson"
  clustering_method: "hierarchical" # Options: "hierarchical", "kmedoids"
  linkage_method: "complete" #  Options: "complete", "average"
  use_pooled_std: False 
